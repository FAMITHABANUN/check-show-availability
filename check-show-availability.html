<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check Show Availability</title>
<style>
  :root{
    --bg:#f5f6fa; --card:#fff; --text:#1a1a2e; --sub:#6b7280;
    --accent:#4f46e5; --accent-light:#eef2ff; --ok:#16a34a; --low:#d97706; --full:#dc2626;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){ --bg:#111218; --card:#1b1c24; --text:#f0f0f3; --sub:#9ca3af; --accent-light:#242642; }
  }
  :root[data-theme="dark"]{ --bg:#111218; --card:#1b1c24; --text:#f0f0f3; --sub:#9ca3af; --accent-light:#242642; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px;}
  h1{font-size:20px;margin:4px 0 2px;}
  .sub{color:var(--sub);font-size:13px;margin-bottom:18px;}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;font-weight:600;}
  select,input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #d1d5db;background:var(--bg);color:var(--text);font-size:15px;margin-bottom:12px;}
  button{width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
  button:active{opacity:.85;}
  .result{display:none;}
  .result.show{display:block;}
  .status-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .dot.ok{background:var(--ok);} .dot.low{background:var(--low);} .dot.full{background:var(--full);}
  .status-text{font-weight:700;font-size:15px;}
  .status-sub{color:var(--sub);font-size:13px;}
  .seat-bar{height:8px;border-radius:4px;background:var(--accent-light);overflow:hidden;margin-top:10px;}
  .seat-fill{height:100%;border-radius:4px;transition:width .3s;}
  .seat-fill.ok{background:var(--ok);} .seat-fill.low{background:var(--low);} .seat-fill.full{background:var(--full);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .stat{background:var(--accent-light);border-radius:10px;padding:10px;text-align:center;}
  .stat .num{font-size:18px;font-weight:700;}
  .stat .lbl{font-size:11px;color:var(--sub);}
  footer{text-align:center;color:var(--sub);font-size:11px;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 Check Show Availability</h1>
  <div class="sub">US-002 · Movie Ticket Booking Management Application</div>

  <div class="card">
    <label>Movie</label>
    <select id="movie">
      <option value="Inception 2" data-total="120">Inception 2</option>
      <option value="The Last Horizon" data-total="90">The Last Horizon</option>
      <option value="Comic Carnival" data-total="60">Comic Carnival</option>
    </select>

    <label>Show Time</label>
    <select id="show">
      <option value="10:00 AM">10:00 AM</option>
      <option value="1:30 PM">1:30 PM</option>
      <option value="6:00 PM">6:00 PM</option>
      <option value="9:30 PM">9:30 PM</option>
    </select>

    <label>Seats Needed</label>
    <input type="number" id="seatsNeeded" value="2" min="1" max="10">

    <button onclick="checkAvailability()">Check Availability</button>
  </div>

  <div class="card result" id="resultCard">
    <div class="status-row">
      <div class="dot" id="statusDot"></div>
      <div>
        <div class="status-text" id="statusText"></div>
        <div class="status-sub" id="statusSub"></div>
      </div>
    </div>
    <div class="seat-bar"><div class="seat-fill" id="seatFill"></div></div>
    <div class="grid">
      <div class="stat"><div class="num" id="availNum">-</div><div class="lbl">Seats Available</div></div>
      <div class="stat"><div class="num" id="totalNum">-</div><div class="lbl">Total Capacity</div></div>
    </div>
  </div>

  <footer>Demo data · seat counts are simulated per show</footer>
</div>

<script>
function seededAvailable(key, total){
  let h=0; for(let i=0;i<key.length;i++){ h=(h*31+key.charCodeAt(i))>>>0; }
  const pct = 0.15 + (h % 80)/100; // 15%-95% booked
  return Math.max(0, Math.round(total*(1-pct)));
}

function checkAvailability(){
  const movieSel = document.getElementById('movie');
  const movie = movieSel.value;
  const total = parseInt(movieSel.selectedOptions[0].dataset.total,10);
  const show = document.getElementById('show').value;
  const needed = parseInt(document.getElementById('seatsNeeded').value,10) || 1;

  const available = seededAvailable(movie+show, total);
  const pctFree = available/total;

  const dot=document.getElementById('statusDot'), fill=document.getElementById('seatFill');
  const statusText=document.getElementById('statusText'), statusSub=document.getElementById('statusSub');

  dot.className='dot'; fill.className='seat-fill';
  let cls, text;
  if(available===0){ cls='full'; text='Fully Booked'; }
  else if(available < needed){ cls='full'; text='Not Enough Seats'; }
  else if(pctFree < 0.25){ cls='low'; text='Available — Filling Fast'; }
  else { cls='ok'; text='Available'; }

  dot.classList.add(cls); fill.classList.add(cls);
  statusText.textContent = text;
  statusSub.textContent = `${movie} · ${show}`;
  fill.style.width = Math.round(pctFree*100)+'%';

  document.getElementById('availNum').textContent = available;
  document.getElementById('totalNum').textContent = total;
  document.getElementById('resultCard').classList.add('show');
}
checkAvailability();
</script>
</body>
</html>
